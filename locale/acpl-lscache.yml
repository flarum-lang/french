acpl-lscache:
  admin:
    cache_enabled_help: 'Consultez la <a>page d''informations</a> pour savoir comment tester le cache. Veuillez noter que lors de la désactivation du cache, toutes les entrées mises en cache pour ce site seront supprimées.'
    cache_enabled_label: 'Activer LSCache'
    cache_exclude_help: 'Saisissez une expression régulière par ligne. <code>/private</code> correspond à tout chemin contenant /private ; <code>^/private$</code> correspond uniquement à /private. Les chaînes de requête sont ignorées. Les pages mises en cache existantes restent disponibles jusqu''à leur expiration ou leur purge. Pour appliquer immédiatement les exclusions, purgez les URL concernées via l''interface en ligne de commande (CLI) ou purgez toutes les entrées LSCache depuis le menu « Cache » de l''administration.'
    cache_exclude_label: 'Exclure les chemins d''accès de la mise en cache'
    clearing_cache_listener_label: 'Purger LSCache lorsque le cache Flarum est vidé'
    drop_qs_help: "Saisissez les noms des paramètres de requête à ignorer lors de la mise en cache, à raison d'un par ligne, par exemple <code>fbclid</code> ou <code>utm*</code>. Les URL qui ne diffèrent que par ces paramètres partagent la même page mise en cache. N'ignorez que les paramètres qui ne modifient pas le contenu de la page. Nécessite LSWS v5.2.3 ou une version plus récente. <a>En savoir plus sur la suppression des chaînes de requête</a>.<br></br>\n⚠️ Ce paramètre modifiera le fichier .htaccess.\n"
    drop_qs_label: 'Abandonner les chaînes de requête'
    permissions:
      purge: '=> acpl-lscache.ref.purge_cache'
    public_cache_ttl_help: 'Définir la durée, en secondes, pendant laquelle les pages publiques doivent être mises en cache. La valeur par défaut est de 604800 secondes (une semaine).'
    public_cache_ttl_label: 'TTL du cache public par défaut'
    purge_all: '=> acpl-lscache.ref.purge_cache'
    purge_modal:
      all_label: 'Toutes les pages mises en cache'
      empty_list_error: 'Saisissez au moins un élément.'
      paths_help: 'Saisissez une URL ou un chemin d''accès par ligne, par exemple <code>{url}/t/general</code> ou <code>/t/general</code>.'
      paths_label: URL
      submit_button: Purger
      tags_help: 'Saisissez une balise LSCache par ligne, par exemple <code>discussion_123</code> ou <code>discussions</code>.'
      tags_label: 'Balise de cache'
      title: '=> acpl-lscache.ref.purge_cache'
      type_label: 'Purge par'
    purge_on_discussion_update_help: 'Saisissez les URL ou mettre en cache les étiquettes que vous souhaitez supprimer lors de la mise à jour d''une discussion, une par ligne. L''URL doit commencer par <code>/</code>, comme par exemple <code>/classements</code>, et les étiquettes doivent quant à elles commencer par <code>tag=</code>, comme par exemple <code>tag=classements</code>. Pour les itinéraires multiples, il est plus rapide d''ajouter une règle dans le fichier .htaccess avec une expression régulière qui marque les itinéraires et d''entrer uniquement cette balise ici. <a>En savoir plus</a>. Par défaut, le cache de la page d''accueil et des discussions mises à jour est purgé.'
    purge_on_discussion_update_label: 'Purger les URL ou mettre en cache les étiquettes lors de la mise à jour d''une discussion'
    serve_stale_help: 'Lorsque le contenu mis en cache est purgé, autorisez LiteSpeed à servir la version précédemment mise en cache tout en générant une nouvelle copie. Cela réduit la charge du serveur, mais les visiteurs peuvent temporairement voir du contenu obsolète. Si cette option est désactivée, les visiteurs doivent attendre que la page soit actualisée.'
    serve_stale_label: 'Servir du contenu obsolète'
    status_codes_cache_help: 'Spécifiez un code d''état HTTP et le nombre de secondes pour la mise en cache de cette page, séparés par un espace. Une par ligne.'
