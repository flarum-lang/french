fof-upload:
  admin:
    help_texts:
      client_extension: "Par défaut, l'extension Upload sélectionnera une extension de fichier sûre en fonction du type MIME.\nPour certains types de fichiers basés sur des données ZIP ou binaires, cela peut entraîner l'utilisation d'extensions génériques au lieu de l'extension attendue.\nVous pouvez saisir ici une liste d'extensions de fichiers, séparées par des virgules, qui seront conservées mot pour mot.\n"
      composer_buttons: "Par défaut, le bouton du gestionnaire de médias et le bouton de téléchargement sont tous deux visibles. Vous pouvez également décider de n'afficher qu'un seul bouton.\n"
      custom_s3_url: "L'URL de base publique à partir de laquelle vos fichiers sont mis à disposition — un CDN ou un domaine personnalisé en amont du seau (bucket).\nLaissez ce champ vide pour utiliser l'URL par défaut du fournisseur. Doit inclure <code>https://</code>.\n"
      disable-download-logging: "Désactivez la journalisation de chaque téléchargement effectué par les utilisateurs de votre forum. En gardant cette option activée, vous pourrez visualiser le nombre de téléchargements en plus d'autres statistiques dans un avenir proche.\n"
      disable-hotlink-protection: "La protection contre les liens hypertextes automatiques empêche l'ouverture des téléchargements à partir d'autres sites. La méthode actuelle nécessite un jeton CSRF et un identifiant de publication.\n"
      download_templates: "Les modèles de téléchargement indiquent comment les téléchargements sont affichés sur votre forum, comme par exemple des prévisualisations ou des boutons. Actuellement disponible :\n"
      mime_types: "Déterminez quels fichiers les membres peuvent transférer, où chaque type de fichier est stocké et comment il apparaît dans un message.\n"
      resize: "Décidez si vous souhaitez redimensionner vos images avant qu'elles ne soient téléchargées. Vous pouvez indiquer une largeur et une hauteur maximales, en pixels. Le processus de redimensionnement conserve le rapport hauteur/largeur des images.\n"
      s3_acl: "S'applique à chaque objet transféré. Laissez ce champ vide pour utiliser la valeur par défaut du fournisseur (généralement « privé »).\nUtilisez <code>public-read</code> si les fichiers doivent être lisibles directement depuis le seau (bucket).\n"
      s3_acl_unsupported: "{provider} ne prend pas en charge les listes de contrôle d'accès (ACL). Contrôlez plutôt l'accès public depuis le tableau de bord du fournisseur.\n"
      s3_compatible_storage: "Les paramètres suivants ne sont obligatoires que si vous utilisez un stockage compatible S3. Si vous utilisez AWS, vous pouvez les laisser vides.\n"
      s3_instance_profile: "Laissez les deux champs vides pour utiliser un rôle IAM à la place — fonctionne uniquement sur EC2, ECS ou EKS.\n"
      s3_path_style: "Place le seau (bucket) dans l'URL plutôt que dans le nom d'hôte. Requis par MinIO et Cloudflare R2 ;\ndéfini automatiquement lorsque vous choisissez un fournisseur.\n"
      storage_configure_another: "D'autres services de stockage sont installés mais ne sont pas encore configurés. La configuration d'un service ne modifie pas l'emplacement des fichiers\ntant que vous ne l'avez pas associé à un type de fichier.\n"
      storage_intro: "Les services que vous avez configurés, ou ceux utilisés par un type de fichier, sont affichés ici. Vous pouvez configurer un service\navant de l'associer à un type de fichier ; attribuez-le dans l'onglet « Fichiers » lorsque vous êtes prêt.\n"
      storage_not_installed: 'Vous recherchez Amazon S3, Cloudflare R2 ou Qiniu ? Ces services nécessitent un paquet supplémentaire — consultez <a>l''installation des adaptateurs de stockage</a>.'
      thumbnail_quality: "Qualité d'encodage comprise de 1 et 100, appliquée aux miniatures WebP et JPEG. Les valeurs plus élevées offrent un rendu plus net,\nmais génèrent des fichiers plus volumineux. Les miniatures GIF et PNG sont sans perte et ne tiennent pas compte de ce paramètre.\nLes miniatures existantes conservent leur qualité actuelle jusqu'à ce qu'elles soient régénérées à l'aide de la commande « backfill ».\n"
      thumbnails: "Génère une miniature pour les images au moment du transfert. La miniature est affichée ;\nen cliquant dessus, le fichier original en pleine résolution s'ouvre dans un nouvel onglet.\nLes miniatures réduisent considérablement la bande passante et le poids des pages pour les forums contenant de nombreuses images volumineuses.\n"
      watermark: "Décidez si un filigrane sera ajouté aux images lors du téléchargement. Les filigranes sont ajoutés aux images qui ne sont pas des GIFS en fonction de vos préférences définies ci-dessous.\n"
    inspect-mime:
      description: "FoF Upload utilise la bibliothèque <a>PHP Mime Detector</a> pour les types MIME courants et PHP Fileinfo comme solution de repli.\nLa valeur MIME renvoyée par Fileinfo peut être différente d'un serveur à l'autre !\n"
      guessed-extension: 'Extension de fichier par défaut (si l''original ne figure pas sur la liste blanche)'
